services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: shopdb-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-shopdb}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shop-network

  # Spring Boot Backend
  backend:
    platform: linux/amd64
    image: manojreddy88836/shop-management-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopmanager-backend
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shopdb}
      MONGO_DB: ${MONGO_DB:-shopdb}
      JWT_SECRET: ${JWT_SECRET:-shopManagerSecretKey2024VeryLongAndSecureKeyForHMACSHA256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # React Frontend
  frontend:
    platform: linux/amd64
    image: manojreddy88836/shop-management-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: shopmanager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
spring.application.name=shop-manager
server.port=${PORT:8080}

# ─── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/shop_management}
spring.data.mongodb.database=${MONGO_DB:shop_management}

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:shopManagerSecretKey2024VeryLongAndSecureKeyForHMACSHA256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.shopmanager=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
